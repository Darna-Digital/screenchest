name: release

# A push to main that changes VERSION to one not yet released builds, signs,
# notarizes and publishes ScreenChest-X.Y.Z-arm64.dmg with its Sparkle
# appcast.xml as GitHub release vX.Y.Z, then redeploys screenchest.com so its
# Download button points at it. See RELEASING.md.
#
# Secrets:
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD      Developer ID Application .p12 (base64) + its password
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER App Store Connect API key (.p8, base64) for notarytool
#   SPARKLE_PRIVATE_KEY                                 EdDSA key the appcast signs the disk image with
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      # A draft left behind by a failed upload does not count as released.
      - name: Decide whether this version still needs releasing
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be plain X.Y.Z, got '${version}'."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          is_draft="$(gh release view "v${version}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [[ "$is_draft" == "false" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v${version} is already released — bump VERSION to ship a new one."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v${version}."
          fi

  check:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/mac.yml

  release:
    needs: [version, check]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — see RELEASING.md."
            exit 1
          fi

      - name: Import the Developer ID certificate
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Resolve the signing identity
        run: |
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Build and sign ScreenChest.app
        run: scripts/build-app.sh

      - name: Check the bundle carries the version being released
        run: |
          bundled="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/ScreenChest.app/Contents/Info.plist)"
          if [[ "$bundled" != "$VERSION" ]]; then
            echo "::error::ScreenChest.app says ${bundled}, VERSION says ${VERSION}."
            exit 1
          fi

      - name: Notarize and package the disk image
        id: dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: echo "path=$(scripts/release.sh build/ScreenChest.app "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"

      - name: Find the previous release
        run: |
          previous="$( (git tag -l 'v[0-9]*' | sed 's/^v//'; echo "$VERSION") | sort -uV | grep -B1 -x "$VERSION" | head -1)"
          if [[ "$previous" == "$VERSION" ]]; then previous=""; fi
          echo "PREVIOUS=${previous}" >> "$GITHUB_ENV"

      # Commit subjects rather than GitHub's generated notes: work is pushed
      # straight to main, so the generated notes would be a bare compare link.
      - name: Write the Sparkle feed
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          git log --no-merges --format='- %s' ${PREVIOUS:+"v${PREVIOUS}..HEAD"} -- . ':!www' | { grep -v '^- Release v' || true; } > "$notes"
          appcast="$(dirname "$DMG")/appcast.xml"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$DMG")"
          scripts/appcast.sh "$DMG" "$notes" "$url" > "$appcast"
          cat "$appcast"
          echo "path=${appcast}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.dmg.outputs.path }}
          APPCAST: ${{ steps.appcast.outputs.path }}
        run: |
          if [[ "$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then
            gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes
          fi
          {
            echo "Signed and notarized. For Apple silicon Macs on macOS 26 or later."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/release-body.md"
          gh release create "v${VERSION}" "$DMG" "$APPCAST" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ScreenChest v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            --latest

  announce:
    needs: release
    uses: ./.github/workflows/deploy-www.yml
    secrets: inherit
